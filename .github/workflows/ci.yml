name: CI / Build & Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Validate Static Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application (Vite + Tailwind)
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          if [ ! -f dist/index.html ]; then
            echo "Erro: dist/index.html não foi gerado pelo build!"
            exit 1
          fi
          echo "Build gerado com sucesso. Arquivos estáticos prontos para publicação."

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: creativebd-dist
          path: dist/
          retention-days: 14
